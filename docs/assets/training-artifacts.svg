<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" role="img" aria-labelledby="title desc">
  <title id="title">Offline training and artifact preparation</title>
  <desc id="desc">Labelled questions and a legal corpus are cleaned, split, chunked, used to mine hard negatives, fine-tune three dense encoders, generate out-of-fold features, and produce frozen checkpoints, indexes, ranking models, policies, and manifests.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 25px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .stage{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .model{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#1e293b}
      .detail{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .group{font:700 16px Inter,Segoe UI,Arial,sans-serif;fill:#334155;letter-spacing:.5px}
      .line{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}
      .merge{fill:none;stroke:#64748b;stroke-width:2}
    </style>
  </defs>

  <rect width="1000" height="1120" fill="#f8fafc"/>
  <text x="500" y="40" text-anchor="middle" class="title">Offline training &amp; artifact preparation</text>

  <rect x="90" y="70" width="350" height="82" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="265" y="101" text-anchor="middle" class="stage">Labelled legal questions</text>
  <text x="265" y="128" text-anchor="middle" class="detail">6,985 cleaned question rows</text>

  <rect x="560" y="70" width="350" height="82" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="735" y="101" text-anchor="middle" class="stage">Vietnamese legal corpus</text>
  <text x="735" y="128" text-anchor="middle" class="detail">8,532 documents</text>

  <path d="M265 152 V190" class="line"/>
  <path d="M735 152 V190" class="line"/>
  <rect x="90" y="196" width="350" height="100" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="265" y="226" text-anchor="middle" class="stage">Split + collision guard</text>
  <text x="265" y="252" text-anchor="middle" class="model">fixed 2,155-query evaluation table</text>
  <text x="265" y="275" text-anchor="middle" class="detail">4,823 clean encoder-training queries</text>

  <rect x="560" y="196" width="350" height="100" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="735" y="226" text-anchor="middle" class="stage">Structure-aware chunking</text>
  <text x="735" y="252" text-anchor="middle" class="model">legal hierarchy → numbered sections</text>
  <text x="735" y="275" text-anchor="middle" class="detail">paragraph fallback · 596,062 chunks</text>

  <path d="M265 296 V338 H500" class="merge"/>
  <path d="M735 296 V338 H500" class="merge"/>
  <path d="M500 338 V368" class="line"/>
  <rect x="245" y="374" width="510" height="100" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="404" text-anchor="middle" class="stage">Hard-negative sample construction</text>
  <text x="500" y="430" text-anchor="middle" class="model">base Harrier + base BAAI/bge-m3 retrieval</text>
  <text x="500" y="453" text-anchor="middle" class="detail">1 positive passage + 7 non-gold document negatives</text>

  <path d="M500 474 V512" class="line"/>
  <rect x="35" y="518" width="930" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="500" y="548" text-anchor="middle" class="group">DENSE ENCODER FINE-TUNING · 1 EPOCH · SEED 20260904</text>

  <rect x="63" y="574" width="278" height="130" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="202" y="606" text-anchor="middle" class="stage">Harrier checkpoint</text>
  <text x="202" y="637" text-anchor="middle" class="model">mainguyen9/</text>
  <text x="202" y="659" text-anchor="middle" class="model">vietlegal-harrier-0.6b</text>
  <text x="202" y="685" text-anchor="middle" class="detail">fine-tuned · max length 512</text>

  <rect x="361" y="574" width="278" height="130" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="500" y="606" text-anchor="middle" class="stage">BGE-M3 checkpoint</text>
  <text x="500" y="642" text-anchor="middle" class="model">BAAI/bge-m3</text>
  <text x="500" y="672" text-anchor="middle" class="detail">fine-tuned · normalized CLS output</text>

  <rect x="659" y="574" width="278" height="130" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="798" y="606" text-anchor="middle" class="stage">Legal embedding checkpoint</text>
  <text x="798" y="637" text-anchor="middle" class="model">bqbbao6/</text>
  <text x="798" y="659" text-anchor="middle" class="model">vietnamese-legal-embedding</text>
  <text x="798" y="685" text-anchor="middle" class="detail">fine-tuned · max length 512</text>

  <path d="M202 704 V774 H270" class="merge"/>
  <path d="M500 704 V750 H270 V774" class="merge"/>
  <path d="M798 704 V726 H270 V774" class="merge"/>
  <path d="M270 774 V812" class="line"/>

  <rect x="70" y="818" width="400" height="112" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="270" y="850" text-anchor="middle" class="stage">Retrieval artifacts</text>
  <text x="270" y="877" text-anchor="middle" class="model">3 fine-tuned checkpoints</text>
  <text x="270" y="901" text-anchor="middle" class="detail">query vectors · chunk vectors · document indexes</text>

  <rect x="530" y="818" width="400" height="112" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="730" y="850" text-anchor="middle" class="stage">Five-fold OOF features</text>
  <text x="730" y="877" text-anchor="middle" class="model">retrieval + FT-BGE + Vietnamese + Jina scores</text>
  <text x="730" y="901" text-anchor="middle" class="detail">no held-out-fold labels in feature construction</text>

  <path d="M470 874 H524" class="line"/>
  <path d="M730 930 V966" class="line"/>
  <rect x="245" y="972" width="510" height="112" rx="12" fill="#0f766e"/>
  <text x="500" y="1005" text-anchor="middle" style="font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#ffffff">Frozen ranking artifacts</text>
  <text x="500" y="1033" text-anchor="middle" style="font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#ffffff">LightGBM LambdaMART · calibrated policies</text>
  <text x="500" y="1059" text-anchor="middle" style="font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#d1fae5">fold models · score caches · SHA-256 manifests</text>
</svg>
