[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legalir-portfolio"
version = "0.1.0"
description = "Public-safe utilities from a Vietnamese legal retrieval pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Danh Duc Nguyen"}]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]
api = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
